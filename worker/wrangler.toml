name = "spor-arne"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# FAQ-en (knowledge/faq.md) bygges inn som tekst
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Anonym telling av hvilke forslag i Spør Arne som brukes mest
[[kv_namespaces]]
binding = "STATS"
id = "c90b71c4f5a94eb898f75fb158490209"

[vars]
# Arne er registrert som offentlig OAuth-klient hos Mobility (portal.mobility.no)
MOBILITY_CLIENT_ID = "01a18250-bf79-7305-828d-bcab0415df41"
ALLOWED_ORIGINS = "https://minkonto.riis.cc,http://minkonto.riis.cc"

# API-nøkkelen settes som hemmelighet, ikke her:
#   npx wrangler secret put ANTHROPIC_API_KEY

# Innlogging med Recover-konto (Microsoft Entra ID). Når begge er satt, krever Spør Arne innlogging.
AZURE_TENANT_ID = "3eda027e-8a74-4cb5-96ca-7586478e54fc"
AZURE_CLIENT_ID = "1d836824-cf57-4a1c-b1a1-ec0fa1b621f6"
