<!doctype html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#143B59" />
  <meta name="robots" content="noindex" />
  <title>Min konto har flyttet</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #143b59;
      --navy-dark: #0f2c43;
      --bg: #e4ebed;
      --surface: #ffffff;
      --text: #192326;
      --muted: #456169;
      --accent: #daf43c;
      --focus: #3b91d3;
      --shadow: 0 1px 2px #0f2c430f, 0 14px 28px -20px #0f2c4359;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 56px;
    }

    .topbar, .hero { max-width: 480px; margin: 0 auto; }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 28px; height: 28px; fill: #fff; flex: none; }
    .brand span { font-weight: 600; font-size: 17px; letter-spacing: .01em; }

    .hero { margin-top: 28px; }
    .hero h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; line-height: 1.15; }
    .hero p { margin: 0; color: #ffffffb8; font-size: 16px; line-height: 1.45; }

    main {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: -32px auto 0;
      padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    }

    .action {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 16px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .action:active { transform: scale(.98); }
    .action:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    @media (hover: hover) {
      .action:hover { box-shadow: 0 8px 20px #0f2c4359; }
    }

    .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--navy-dark);
    }

    .icon svg { width: 24px; height: 24px; }

    .label { flex: 1; min-width: 0; }
    .label strong { display: block; font-size: 17px; font-weight: 600; }
    .label small { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; line-height: 1.35; }

    .chevron { flex: none; width: 20px; height: 20px; color: var(--muted); }

    .note { margin: 16px 4px 0; color: var(--muted); font-size: 14px; line-height: 1.45; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0.711 -0.012 30.653 30.653" aria-hidden="true">
          <path d="M11.9157 2.8034 11.5083.908 18.9754 4.2569 13.5059 10.3443 13.1169 8.5055A8 8 90 1019.4 8.7L23.2154 4.1904A13.7747 13.7747 90 1111.9157 2.8034Z" />
        </svg>
        <span>Min konto</span>
      </div>
    </div>
    <div class="hero">
      <h1>Min konto har flyttet</h1>
      <p>Vi har flyttet appen til minkonto.recover.no.</p>
    </div>
  </header>

  <main>
    <a class="action" href="https://minkonto.recover.no/">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </span>
      <span class="label">
        <strong>Gå til minkonto.recover.no</strong>
        <small>Husk å oppdatere bokmerket eller snarveien på hjemskjermen.</small>
      </span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </a>
    <p class="note">Den gamle adressen minkonto.riis.cc blir slått av.</p>
  </main>
</body>
</html>
